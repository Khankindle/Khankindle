<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PocketLedger</title>
  <meta http-equiv="refresh" content="0;url=__STREAMLIT_URL__" />
  <link rel="canonical" href="__STREAMLIT_URL__" />
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f8f8f7;
      color: #191003;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      text-align: center;
      padding: 24px;
    }
    a { color: #b55824; }
  </style>
</head>
<body>
  <main>
    <p>Opening the PocketLedger Streamlit app…</p>
    <p><a id="fallback" href="__STREAMLIT_URL__">Continue to Streamlit</a></p>
  </main>
  <script>
    (function () {
      var base = "__STREAMLIT_URL__".replace(/\/$/, "");
      var target = base + window.location.search + window.location.hash;
      document.getElementById("fallback").href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
